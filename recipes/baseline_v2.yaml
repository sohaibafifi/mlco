# baseline_v2 - convergent-training receipt for paper-cax.
#
# Paper-cax reports CF-adjudication results on the trio
# CVRPTW + OP + FJSP: CVRPTW and OP are the multi-family
# adjudication substrates (LP-anchored backend rank-inverts
# the proxy gradient), FJSP is the theory-confirming
# rank-aligned ablation (LP-binding and gradient-mass agree,
# so backends agree). Those three get the full convergence
# schedule. The remaining three (jssp / pdp / flp) get a
# lighter pass for infrastructure compatibility; they are
# excluded from paper-cax sec 4 for the reasons documented
# inline below.
#
# Audit before running: `neuroco estimate-budget recipes/baseline_v2.yaml`.
# Expected wall-clock on a single 24GB GPU: ~14 hours (measured).
#
# Convergence receipt: each problem's `eval` stage compares the
# trained policy against the classical solver (PyVRP HGS for VRPTW,
# OR-Tools CP-SAT for OP / FJSP / JSSP / FLP / PDP). Paper-cax
# sec 3 setup paragraph reports the realised optimality gap so
# reviewers can verify the policy is not random before reading
# the attribution numbers.
name: baseline_v2
description: |
  Convergent retrain for the paper-cax baseline comparison. The
  Adebayo-sanity claim in sec 4.6 (and the CF-adjudication
  ground-truth in sec 4.2) require policies trained to within
  ~15% of the classical solver gap; baseline_v1's 5-epoch
  checkpoints are too weak to support those claims.

parallel: 2

problems:
  # ---------- Paper-priority problems (full convergence). ----------
  vrptw:
    seeds: [0, 1, 2]
    train:
      # Standard AttentionModel: 100 epochs x 100k = 10M samples seen.
      # Eval gap typically lands ~5-10% over PyVRP at this budget.
      overrides:
        - "trainer.max_epochs=100"
        - "model.train_data_size=20000"
        - "model.val_data_size=1000"
        - "model.optimizer_kwargs.lr=1e-4"
        - "model.batch_size=1024"
    baseline:
      overrides:
        - "baseline.num_problems=100"
        - "baseline.max_runtime_s=5.0"
        - "baseline.thread_mode=multi"
        - "baseline.num_procs=8"
    eval:
      overrides:
        - "model.test_data_size=100"
    explain:
      methods: [gradient, ig, contrastive, deeplift]
      overrides:
        - "xai.num_instances=16"
        - "xai.run_sufficiency=true"
        - "xai.run_sanity_check=true"
        - "xai.sanity_trials=5"
        - "xai.run_encoder_probes=true"
    probe:
      args: ["--num-instances", "32", "--epochs", "300", "--pca-components", "10"]

  jssp:
    seeds: [0, 1, 2]
    train:
      # L2D: 50 epochs x 10k = 500k samples; eval gap typically
      # lands ~15-20% over CP-SAT at this budget.
      overrides:
        - "trainer.max_epochs=50"
        - "model.train_data_size=10000"
        - "model.val_data_size=1000"
        - "model.optimizer_kwargs.lr=1e-4"
        - "model.batch_size=128"
    baseline:
      overrides:
        - "baseline.num_problems=50"
        - "baseline.max_runtime_s=10.0"
    eval:
      overrides:
        - "model.test_data_size=50"
    explain:
      methods: [gradient, ig, contrastive, deeplift]
      overrides:
        - "xai.num_instances=8"
        - "xai.run_sufficiency=true"
        - "xai.run_sanity_check=true"
        - "xai.sanity_trials=5"
    probe:
      args: ["--num-instances", "32", "--epochs", "300"]

  op:
    # OP at N=50: prize-collecting single-route with budget cap.
    # 30 epochs is enough for the LP-anchored Lambda backend to land
    # on the binding family (paper-cax sec 4.2 reports 0.906 vs proxy
    # 0.156 on seed 0).
    seeds: [0, 1, 2]
    train:
      overrides:
        - "trainer.max_epochs=30"
        - "model.train_data_size=20000"
        - "model.batch_size=256"
    baseline:
      overrides:
        - "baseline.num_problems=20"
        - "baseline.max_runtime_s=5.0"
    eval:
      overrides:
        - "model.test_data_size=20"
    explain:
      methods: [gradient, ig]
      overrides:
        - "xai.num_instances=4"

  flp:
    # k-median FLP at N=20 (graph FLP). UFL LP relaxation is
    # nearly tight; the LP-anchored Lambda backend lands on the
    # binding family with high agreement (paper-cax sec 4.2 reports
    # 0.906 vs proxy 0.594 on seed 0). Empirically 5 epochs is too
    # few: the policy stays in spatial-nearest heuristic and the
    # LP-vs-proxy ranking flips. 30 epochs reproduces the result.
    seeds: [0, 1, 2]
    train:
      overrides:
        - "trainer.max_epochs=30"
        - "model.train_data_size=10000"
        - "model.batch_size=128"
    eval:
      overrides:
        - "model.test_data_size=20"
    explain:
      methods: [gradient, ig]
      overrides:
        - "xai.num_instances=4"

  # ---------- Secondary problems (lighter; keep the infra wired). ----------
  pdp:
    seeds: [0, 1, 2]
    train:
      overrides:
        - "trainer.max_epochs=30"
        - "model.train_data_size=20000"
        - "model.batch_size=256"
    baseline:
      overrides:
        - "baseline.num_problems=20"
        - "baseline.max_runtime_s=3.0"
    eval:
      overrides:
        - "model.test_data_size=20"
    explain:
      methods: [gradient, contrastive]
      overrides:
        - "xai.num_instances=4"

  fjsp:
    seeds: [0, 1, 2]
    train:
      overrides:
        - "trainer.max_epochs=20"
        - "model.train_data_size=5000"
        - "model.batch_size=64"
    baseline:
      overrides:
        - "baseline.engine=ortools"
        - "baseline.num_problems=20"
        - "baseline.max_runtime_s=10.0"
    eval:
      overrides:
        - "model.test_data_size=20"
    explain:
      methods: [gradient, deeplift]
      overrides:
        - "xai.num_instances=4"
