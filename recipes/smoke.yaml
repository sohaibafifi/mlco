# A complete, short CPU workflow. It validates infrastructure, not policy quality.
name: smoke
description: TSP training, nearest-neighbour reference, fixed-test evaluation and gradient explanation.
parallel: 1
problems:
  tsp:
    seeds: [0]
    train:
      backend: torch
      device: cpu
      algo: pomo
      backbone: am
      size: 6
      epochs: 1
      steps_per_epoch: 2
      batch_size: 4
      eval_batch_size: 8
      hidden_dim: 16
      num_layers: 1
      num_heads: 2
      n_starts: 2
    baseline: {}
    eval: {}
    explain:
      methods: [gradient]
      num_instances: 2
      top_k: 2
      max_steps: 2
      run_sufficiency: true
