[project]
name = "neuro-co-cli"
version = "0.2.0"
description = "Training, evaluation, and experiment commands for neuro-co."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Sohaib Afifi", email = "me@sohaibafifi.com" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "neuro-co-core>=0.2.0,<0.3",
  "neuro-co-attr>=0.2.0,<0.3",
  "neuro-co-probe>=0.2.0,<0.3",
  "neuro-co-problems>=0.2.0,<0.3",
  "torch>=2.12,<2.13",
]

[project.optional-dependencies]
# `neuroco results` aggregation + `neuroco figures` plots + YAML recipes.
report = ["pandas~=2.2", "pyarrow>=15", "pyyaml>=6.0", "rich~=13.7", "matplotlib~=3.10"]

[project.scripts]
neuroco = "neuro_co.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neuro_co"]
