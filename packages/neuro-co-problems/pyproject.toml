[project]
name = "neuro-co-problems"
version = "0.2.0"
description = "Problem environments, concept banks, and baseline solvers for neuro-co."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Sohaib Afifi", email = "me@sohaibafifi.com" }]
keywords = ["combinatorial-optimization", "vrptw", "jssp", "plugins"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "neuro-co-core>=0.2.0,<0.3",
  "torch~=2.12",
  "numpy>=1.24,<3",
]

[project.optional-dependencies]
jax = ["jax>=0.10.1"]
# Classical baseline solvers (optional). pyvrp is pre-1.0; pin the minor.
pyvrp = ["pyvrp~=0.11.0", "pebble~=5.2"]
ortools = ["ortools~=9.15"]
# Umbrella extra pulled by `neuro-co-cax[cp]`.
cp = ["pyvrp~=0.11.0", "pebble~=5.2", "ortools~=9.15"]

# Per-problem subpackages register themselves via these entry points.
# Third-party problems plug in the same way: declare an entry point in
# the `neuro_co.problems` group pointing at a module whose import
# triggers `register_concept_bank(...)` and any solver registrations.
[project.entry-points."neuro_co.problems"]
vrptw = "neuro_co.problems.vrptw"
jssp = "neuro_co.problems.jssp"
pdp = "neuro_co.problems.pdp"
fjsp = "neuro_co.problems.fjsp"
op = "neuro_co.problems.op"
flp = "neuro_co.problems.flp"

# Constructors are loaded only when their problem and backend are requested.
[project.entry-points."neuro_co.envs"]
"torch.tsp" = "neuro_co.problems.tsp.env:TSPEnv"
"torch.atsp" = "neuro_co.problems.atsp.env:ATSPEnv"
"torch.cvrp" = "neuro_co.problems.cvrp.env:CVRPEnv"
"torch.cvrptw" = "neuro_co.problems.vrptw.env:CVRPTWEnv"
"torch.op" = "neuro_co.problems.op.env:OPEnv"
"torch.pdp" = "neuro_co.problems.pdp.env:PDPEnv"
"torch.mtsp" = "neuro_co.problems.mtsp.env:MTSPEnv"
"torch.fjsp" = "neuro_co.problems.fjsp.env:FJSPEnv"
"jax.tsp" = "neuro_co.problems.tsp.jax_env:JaxTSPEnv"
"jax.cvrp" = "neuro_co.problems.cvrp.jax_env:JaxCVRPEnv"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neuro_co"]
