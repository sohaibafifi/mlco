# W&B sweep template for TSP-20 POMO.
#
# Run:
#   wandb sweep packages/neuro-co-problems/examples/sweep_wandb.yaml
#   wandb agent <sweep_id>
#
# The suite writes metrics to JSON. Add W&B metric logging to the runner
# before using this template to rank trials.

program: packages/neuro-co-problems/benchmarks/suite.py
method: bayes
metric:
  name: eval_tour_length_final
  goal: minimize
parameters:
  problem:
    value: tsp
  size:
    value: 20
  algo:
    value: pomo
  steps:
    value: 200
  batch_size:
    values: [32, 64, 128]
  hidden_dim:
    values: [64, 128, 256]
  num_layers:
    values: [2, 3, 4]
  num_heads:
    value: 8
  lr:
    distribution: log_uniform_values
    min: 1.0e-5
    max: 1.0e-3
  n_starts:
    values: [10, 20, 30]
  seed:
    value: 0
  output:
    value: benchmarks/results/sweep.json
command:
  - ${env}
  - uv
  - run
  - --no-sync
  - python
  - ${program}
  - ${args}
