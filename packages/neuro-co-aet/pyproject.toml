[project]
name = "neuro-co-aet"
version = "0.2.0"
description = "Energy, carbon, and Amortized Efficiency Threshold (AET) analysis."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Sohaib Afifi", email = "me@sohaibafifi.com" }]
keywords = ["green-ai", "energy", "carbon", "sustainability", "amortized-efficiency-threshold"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  # The Windows EMI adapter is validated against this exact implementation.
  "codecarbon==3.3.1",
  "nvidia-ml-py>=12.535",
  "numpy>=1.24,<3",
  "matplotlib~=3.10",
]

[project.optional-dependencies]
rapl = ["pyRAPL>=0.2.3; sys_platform == 'linux'"]
analysis = ["pandas~=2.2"]
experiments = [
  "neuro-co-core[gnn]>=0.2.0,<0.3",
  "neuro-co-problems[cp]>=0.2.0,<0.3",
  "pyyaml>=6.0",
  "torch>=2.12,<2.13",
]

[project.scripts]
neuroco-aet-report = "neuro_co.aet.analysis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neuro_co"]
