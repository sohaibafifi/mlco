[project]
name = "neuro-co-attr"
version = "0.2.0"
description = "Action attribution and faithfulness metrics for neural combinatorial optimization."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Sohaib Afifi", email = "me@sohaibafifi.com" }]
keywords = ["attribution", "faithfulness", "explainable-ai", "neural-combinatorial-optimization"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch~=2.12",
  "numpy>=1.24,<3",
  "neuro-co-core>=0.2.0,<0.3",
  "captum>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neuro_co"]
