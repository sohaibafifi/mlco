[project]
name = "neuro-co-dual"
version = "0.2.0"
description = "Constraint multipliers for training, cost shaping, and policy conditioning."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Sohaib Afifi", email = "me@sohaibafifi.com" }]
keywords = [
  "neural-combinatorial-optimization",
  "reinforcement-learning",
  "lagrangian-duals",
  "reward-shaping",
  "constraint-programming",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch~=2.12",
  "numpy>=1.24,<3",
  "neuro-co-core>=0.2.0,<0.3",
  "neuro-co-cax>=0.2.0,<0.3",
  "neuro-co-attr>=0.2.0,<0.3",
]

[project.optional-dependencies]
# LP / subgradient dual backends need OR-Tools + problem instance generators.
duals = ["neuro-co-cax[cp]>=0.2.0,<0.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neuro_co"]
