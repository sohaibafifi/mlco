[project]
name = "neuro-co-scale"
version = "0.2.0"
description = "Partitioning, hierarchical policies, and evaluation for large vehicle routing problems."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Sohaib Afifi", email = "me@sohaibafifi.com" }]
keywords = [
  "vehicle-routing",
  "neural-combinatorial-optimization",
  "large-scale",
  "decomposition",
  "benchmarking",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24,<3",
  "torch~=2.12",
  "neuro-co-core>=0.2.0,<0.3",
  "neuro-co-problems>=0.2.0,<0.3",
  "pyvrp>=0.11.3",
]

[project.optional-dependencies]
report = ["pandas~=2.2", "pyarrow>=15", "pyyaml>=6.0"]

[project.scripts]
neuroco-scale = "neuro_co.scale.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neuro_co"]
